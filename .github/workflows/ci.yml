name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  packages:
    runs-on: ubuntu-latest
    name: Packages (typecheck)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-
      - name: Install
        run: bun install
      - name: Typecheck packages
        run: bunx nx run-many -t typecheck --projects=@fe/core,@fe/specifier,@fe/cli,@fe/runtime,@fe/compiler,@fe/jit-plugin-solid

  sandbox:
    runs-on: ubuntu-latest
    name: Sandbox (typecheck + build)
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-
      - name: Install
        run: bun install
      - name: Typecheck sandbox
        run: bunx nx run-many -t typecheck --projects=@conqueso/fe-mfe-a,@conqueso/fe-mfe-b,host-app,@fe/fe-devtools
      - name: Build sandbox
        run: |
          cd sandbox
          bun fe check mfe-a
          bun fe check mfe-b
          bun fe check ../toolkit/devtools
          bun fe check host-app
